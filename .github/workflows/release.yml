name: Release

# Builds installers for Windows and Linux and publishes a GitHub release
# whenever a version tag is pushed, for example:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Tags containing a hyphen (v0.2.0-beta.1) are published as pre-releases.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # The gh CLI used in the release jobs reads this.
  GH_TOKEN: ${{ github.token }}

jobs:
  # Fails fast if the tag does not match the app's version, then creates a *draft* release.
  # Creating it once, up front, means the parallel build jobs below cannot race to create
  # duplicate releases, and nothing is public until every build has succeeded.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      # The app version lives only in package.json: tauri.conf.json points at it, and the
      # version in src-tauri/Cargo.toml is not used for anything.
      - name: Check that the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package_json=$(jq -r .version package.json)
          tauri_conf=$(jq -r .version src-tauri/tauri.conf.json)

          echo "tag:                  $tag"
          echo "package.json:         $package_json"
          echo "tauri.conf.json:      $tauri_conf"

          if [ "$tauri_conf" != "../package.json" ]; then
            echo "::error::src-tauri/tauri.conf.json must have \"version\": \"../package.json\" so the installers use the package.json version."
            exit 1
          fi

          if [ "$tag" != "$package_json" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package.json version ($package_json). Bump it to $tag, then re-tag."
            exit 1
          fi

      - name: Create draft release
        id: create
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f name="better-text-client ${GITHUB_REF_NAME}" \
            -F draft=true \
            -F prerelease=${{ contains(github.ref_name, '-') }} \
            -F generate_release_notes=true \
            --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 on purpose: binaries built there run on a wider range of Linux distributions.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # The project uses bun; this runs the tauri CLI from package.json.
          tauriScript: bun run tauri

      # Extra downloads that need no installer, both x86_64 (the only architecture built):
      #
      #   Windows  The bare executable, with the interface embedded in it. It needs the WebView2
      #            runtime, which Windows 11 and up-to-date Windows 10 include; the installers
      #            download it when missing, but a bare executable cannot.
      #   Linux    A .tar.gz with the bare executable and a README (packaging/linux/README.txt). It
      #            uses the system's WebKitGTK, unlike the AppImage that tauri-action uploads,
      #            which carries its own and suits systems that lack it.
      #
      # Uploaded through the documented REST endpoint using the release id, because the release is
      # still a draft here and drafts cannot be looked up by tag.
      - name: Upload the portable builds
        shell: bash
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          if [ "$RUNNER_OS" = "Windows" ]; then
            name="better-text-client_${version}_x64-portable.exe"
            cp src-tauri/target/release/better-text-client.exe "$name"
          else
            dir="better-text-client_${version}_linux_x86_64"
            name="${dir}.tar.gz"
            mkdir "$dir"
            cp src-tauri/target/release/better-text-client "$dir/"
            cp packaging/linux/README.txt "$dir/README.txt"
            # Fixed ownership, so the archive does not carry the runner's user ids.
            tar --owner=0 --group=0 --numeric-owner -czf "$name" "$dir"
            tar -tzvf "$name" # shows what went in, in the log
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${name}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}"

  # Runs only if every build succeeded; turns the draft into a public release.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false
