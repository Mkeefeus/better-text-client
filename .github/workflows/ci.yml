name: CI

# Type-checks, tests and builds the frontend on every push to main and every pull request.
# (Building the installers is the Release workflow's job, and only runs for version tags.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # The app ships for both, so a failure on one should not hide the result on the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Type-checks the app and the tests. `bun run build` does not run tsc, so this is the only place types are checked.
      - name: Type check
        run: bun run typecheck

      # Runs tests/*.test.ts against mock Archipelago and tracker servers. Needs no network.
      - name: Test
        run: bun test

      - name: Build the frontend
        run: bun run build
